name: OIDC diag
on:
  push:
    branches: [claude/oidc-diag]
permissions:
  id-token: write
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for body in none perms; do
            oidc=$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=claude-code-github-action" | jq -r .value)
            echo "== claims"; cut -d. -f2 <<<"$oidc" | tr '_-' '/+' | base64 -d 2>/dev/null | jq '{sub,aud,iss,repository,repository_owner,event_name,ref,job_workflow_ref,workflow_ref,repository_visibility}' || true
            if [ $body = perms ]; then data='{"permissions":{"contents":"read","pull_requests":"write"}}'; else data=''; fi
            echo "== exchange ($body)"
            curl -sS -o /tmp/r -w '%{http_code}\n' -X POST -H "Authorization: Bearer $oidc" ${data:+-H "Content-Type: application/json" -d "$data"} https://api.anthropic.com/api/github/github-app-token-exchange
            jq 'del(.token,.app_token)' /tmp/r 2>/dev/null || head -c 300 /tmp/r
          done
