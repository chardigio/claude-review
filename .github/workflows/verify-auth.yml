# Signs in to Anthropic with this job's GitHub identity token (Workload Identity
# Federation) and makes one API call. Run it from the Actions tab to test a
# federation rule; none of the inputs are secret.
name: Verify Anthropic auth

on:
  workflow_dispatch:
    inputs:
      federation-rule-id:
        description: Federation rule (fdrl_...)
        required: true
      organization-id:
        description: Anthropic organization ID (UUID)
        required: true
      service-account-id:
        description: Service account (svac_...)
        required: true
      workspace-id:
        description: Workspace (wrkspc_...), only if the rule covers more than one workspace
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: Get GitHub identity token
        run: |
          curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
            | jq -r .value > "$RUNNER_TEMP/anthropic-identity-token"
      - name: Call the Anthropic API
        run: node src/verify-auth.ts
        env:
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/anthropic-identity-token
          ANTHROPIC_FEDERATION_RULE_ID: ${{ inputs.federation-rule-id }}
          ANTHROPIC_ORGANIZATION_ID: ${{ inputs.organization-id }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ inputs.service-account-id }}
          ANTHROPIC_WORKSPACE_ID: ${{ inputs.workspace-id }}
