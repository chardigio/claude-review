# Signs in to Anthropic with this job's GitHub identity token (Workload Identity
# Federation) and makes one API call. Runs when this file changes, or from the
# Actions tab. None of these IDs are secret.
name: Verify Anthropic auth

on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-auth.yml, src/verify-auth.ts]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: Get GitHub identity token
        run: |
          curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
            | jq -r .value > "$RUNNER_TEMP/anthropic-identity-token"
      - name: Show the token's claims
        # The claims a federation rule matches against. The signature is not printed.
        run: |
          cut -d. -f2 "$RUNNER_TEMP/anthropic-identity-token" | tr '_-' '/+' | base64 -d 2>/dev/null \
            | jq '{iss, aud, sub, repository, repository_owner, ref, event_name, job_workflow_ref}' || true
      - name: Call the Anthropic API
        run: node src/verify-auth.ts
        env:
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/anthropic-identity-token
          ANTHROPIC_FEDERATION_RULE_ID: fdrl_013RuAs3AjQTQr3uCkSTd9GT
          ANTHROPIC_ORGANIZATION_ID: 8c9741ac-80cb-4921-83b0-035db2ece654
          ANTHROPIC_SERVICE_ACCOUNT_ID: svac_01THaxpeHHsA5tcgrogWYzwM
          ANTHROPIC_WORKSPACE_ID: wrkspc_01PGX6ZU3jcE98gaDxSEJb2P
