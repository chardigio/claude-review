name: Claude PR Review
description: Reviews a pull request with a Claude Managed Agents session and posts the findings as a PR review.
branding:
  icon: eye
  color: orange

inputs:
  anthropic-api-key:
    description: >-
      Anthropic API key. Leave empty (the default) to sign in with Workload
      Identity Federation instead, which needs `id-token: write` on the job.
    default: ""
  anthropic-federation-rule-id:
    description: WIF federation rule (fdrl_...). Not secret.
    default: fdrl_013RuAs3AjQTQr3uCkSTd9GT
  anthropic-organization-id:
    description: Anthropic organization ID (UUID). Not secret.
    default: 8c9741ac-80cb-4921-83b0-035db2ece654
  anthropic-service-account-id:
    description: The federation rule's target service account (svac_...). Not secret.
    default: svac_01THaxpeHHsA5tcgrogWYzwM
  anthropic-workspace-id:
    description: Workspace the reviewer runs in (wrkspc_...). Not secret.
    default: wrkspc_01PGX6ZU3jcE98gaDxSEJb2P
  github-token:
    description: >-
      Token used to read the PR, clone the repo into the sandbox, and post the
      review. Leave it as the default to post as the Claude GitHub App when
      it's installed on the repo, or as github-actions otherwise.
    default: ${{ github.token }}
  post-as-claude:
    description: >-
      Post the review as the Claude GitHub App (claude[bot]) instead of
      github-actions[bot]. Needs the app installed on the repo and
      `id-token: write`; falls back to github-actions when either is missing.
    default: "true"
  budget-usd:
    description: Hard spend cap for one review session, in US dollars (list price).
    default: "5"
  extra-instructions:
    description: Repo-specific guidance appended to the review request.
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: 24
        # Runs in the caller's workspace; don't let it cache by the caller's lockfile.
        package-manager-cache: false
    - name: Install dependencies
      shell: bash
      run: npm ci --omit=dev --no-audit --no-fund --prefix "$GITHUB_ACTION_PATH"
    - name: Get Anthropic identity token
      if: inputs.anthropic-api-key == ''
      shell: bash
      run: |
        if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
          echo "::error::No anthropic-api-key given and no OIDC token available. Add 'id-token: write' to the job's permissions."
          exit 1
        fi
        curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
          | jq -r .value > "$RUNNER_TEMP/anthropic-identity-token"
        echo "ANTHROPIC_IDENTITY_TOKEN_FILE=$RUNNER_TEMP/anthropic-identity-token" >> "$GITHUB_ENV"
    # Same OIDC exchange the official Claude Code action uses: Anthropic checks
    # the job's identity token and returns a short-lived Claude app token for
    # this repo. Only when the caller didn't pass their own github-token.
    - name: Get Claude GitHub App token
      id: claude-app
      if: inputs.post-as-claude == 'true' && inputs.github-token == github.token
      shell: bash
      run: |
        if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
          echo "::warning::No OIDC token available, so the review will post as github-actions."
          exit 0
        fi
        oidc=$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=claude-code-github-action" | jq -r .value)
        resp=$(curl -sS -X POST -H "Authorization: Bearer $oidc" -H "Content-Type: application/json" \
          -d '{"permissions":{"contents":"read","pull_requests":"write"}}' \
          https://api.anthropic.com/api/github/github-app-token-exchange)
        token=$(jq -r '.token // .app_token // empty' <<<"$resp")
        if [ -z "$token" ]; then
          echo "::warning::Couldn't get a Claude GitHub App token, so the review will post as github-actions. Is the Claude app installed on this repo? $(jq -c '.error.message // .message // .' <<<"$resp")"
          exit 0
        fi
        echo "::add-mask::$token"
        echo "token=$token" >> "$GITHUB_OUTPUT"
    - name: Run review
      shell: bash
      run: node "$GITHUB_ACTION_PATH/src/review.ts"
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        ANTHROPIC_FEDERATION_RULE_ID: ${{ inputs.anthropic-federation-rule-id }}
        ANTHROPIC_ORGANIZATION_ID: ${{ inputs.anthropic-organization-id }}
        ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ inputs.anthropic-service-account-id }}
        ANTHROPIC_WORKSPACE_ID: ${{ inputs.anthropic-workspace-id }}
        GITHUB_TOKEN: ${{ steps.claude-app.outputs.token || inputs.github-token }}
        INPUT_BUDGET_USD: ${{ inputs.budget-usd }}
        INPUT_EXTRA_INSTRUCTIONS: ${{ inputs.extra-instructions }}
        INPUT_ANTHROPIC_WORKSPACE_ID: ${{ inputs.anthropic-workspace-id }}
