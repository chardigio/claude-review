name: Claude PR Review
description: Reviews a pull request with a Claude Managed Agents session and posts the findings as a PR review.
branding:
  icon: eye
  color: orange

inputs:
  anthropic-api-key:
    description: Anthropic API key from the Console org that holds the reviewer agent.
    required: true
  github-token:
    description: Token used to read the PR, clone the repo into the sandbox, and post the review.
    default: ${{ github.token }}
  budget-usd:
    description: Hard spend cap for one review session, in US dollars (list price).
    default: "5"
  extra-instructions:
    description: Repo-specific guidance appended to the review request.
    default: ""
  anthropic-workspace-id:
    description: Console workspace ID, only used to build the live session link in the log.
    default: default

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Install dependencies
      shell: bash
      run: npm ci --omit=dev --no-audit --no-fund --prefix "$GITHUB_ACTION_PATH"
    - name: Run review
      shell: bash
      run: node "$GITHUB_ACTION_PATH/src/review.ts"
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_BUDGET_USD: ${{ inputs.budget-usd }}
        INPUT_EXTRA_INSTRUCTIONS: ${{ inputs.extra-instructions }}
        INPUT_ANTHROPIC_WORKSPACE_ID: ${{ inputs.anthropic-workspace-id }}
